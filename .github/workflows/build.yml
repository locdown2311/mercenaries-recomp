name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone xboxrecomp toolkit
        run: git clone --depth 1 https://github.com/sp00nznet/xboxrecomp.git xboxrecomp

      # The Visual Studio generator name changes between runner images.
      # msvc-dev-cmd locates the installed VS, runs vcvars and puts cl.exe
      # on PATH; Ninja (preinstalled on the runner) then drives MSVC directly.
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "build/mercenaries_recomp.exe"
          if (!(Test-Path $exe)) { throw "Executable not found at $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mercenaries-recomp
          path: |
            build/mercenaries_recomp.exe
            build/*.pdb
          if-no-files-found: error
